name: News collector dry run
# Runs the Supabase "news" function's collector against the live feeds without writing anything,
# so changes to it can be checked before redeploying.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/news/**']
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x
      - run: deno run --allow-net --allow-env --allow-read supabase/functions/news/index.ts --dry
      - name: Backup-file mode (what the 10-minute refresher writes)
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write supabase/functions/news/index.ts --json /tmp/news.json
          deno run --allow-net --allow-env --allow-read --allow-write supabase/functions/news/index.ts --json /tmp/news.json
          python3 -c "import json; d=json.load(open('/tmp/news.json')); [print(i.get('source'),'|',i.get('cat'),'|',i['title'][:60],'|',(i.get('img') or '-')[:70],'|',i['link'][:60],'|',(i.get('summary') or '')[:80],'|',i.get('author')) for i in d['items'][:40]]"
