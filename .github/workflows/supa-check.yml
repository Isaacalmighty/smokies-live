name: Check Supabase setup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/supa_check.mjs supa
      - name: Save the report to the feeds branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch feeds "$URL" feeds
          mkdir -p feeds/supa && cp supa/report.txt feeds/supa/report.txt
          cd feeds
          git config user.name "smokies-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supa && git commit -qm "Supabase check $(date -u +%FT%TZ)" && git push -q origin feeds || echo "nothing to save"
